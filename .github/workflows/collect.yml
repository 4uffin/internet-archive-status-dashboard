name: collect
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ia-collector
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Load previous data
        run: |
          if git fetch --depth=1 origin data 2>/dev/null; then
            git show FETCH_HEAD:data.json > data.json || echo '{}' > data.json
          else
            echo '{}' > data.json
          fi
      - run: node collect.mjs data.json
      - name: Publish to data branch (single commit, no history growth)
        run: |
          mkdir /tmp/pub && cp data.json /tmp/pub/ && cd /tmp/pub
          git init -q -b data
          git config user.name "ia-collector"
          git config user.email "ia-collector@users.noreply.github.com"
          git add data.json
          git commit -qm "update $(date -u +%FT%TZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
